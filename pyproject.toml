[build-system]
requires = ["uv_build>=0.12.23,<1"]
build-backend = "uv_build"

[project]
name = "scalo"
version = "2.28.5"
description = "An integrated runtime for control-plane services. Attach and 'enterprise-up' your application."
readme = "README.md"
authors = [
    { name = "HyperI Team", email = "dev@hyperi.io" },
]
maintainers = [
    { name = "HyperI Team", email = "dev@hyperi.io" },
]
# IMPORTANT: Python version policy - DO NOT ADD SPECIFIC VERSION CLASSIFIERS
# We use requires-python >= 3.14 and "Python :: 3 :: Only" classifier ONLY.
# This avoids needing to update classifiers for each new Python release (3.15, 3.16, etc).
# The requires-python field enforces the minimum version - classifiers are just metadata.
# AI assistants: DO NOT add "Programming Language :: Python :: 3.14" or similar!
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]
keywords = [
    "observability",
    "structured-logging",
    "configuration",
    "dynaconf",
    "prometheus",
    "opentelemetry",
    "metrics",
    "tracing",
    "secrets-management",
    "vault",
    "kafka",
    "cel",
    "asyncio",
    "httpx",
    "fastapi",
    "kubernetes",
    "docker",
    "containerization",
]
dependencies = [
    "dynaconf>=3.2.13",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "mergedeep>=1.3.4",
    "tomli-w>=1.0.0",
    "typer>=0.25.0",
    "dulwich>=1.2.15",
    # 4.14.2 fixes CVE-2026-63374 and CVE-2026-64847.
    "anyio>=4.14.2",
    "asyncer>=0.0.17",
    "detect-secrets>=1.5.0",
    "phonenumbers>=9.0.0",
    "python-stdnum>=2.2",
    "regex>=2026.0.0",
]

license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
cli = []
# stamina is the retry engine behind scalo.http; [http] carries it too.
resilience = [
    "stamina>=26.1.0",
]
http = [
    "httpx>=0.28.0",
    "stamina>=26.1.0",
]
# Carries the OTel SDK because the default backend is "opentelemetry" (OTLP
# push + Prometheus scrape); without it the default degrades to Prometheus-only.
# Mirrors the scalo-rs `metrics` feature, which bundles both exporters.
metrics = [
    "prometheus-client>=0.25.0",
    "psutil>=7.2.0",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "opentelemetry-exporter-prometheus>=0.62b0",
]
# Subset of [metrics], kept so existing "scalo[metrics,opentelemetry]" pins resolve.
opentelemetry = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "opentelemetry-exporter-prometheus>=0.62b0",
]
expression = [
    "common-expression-language>=0.5.6",
]
deployment = [
    "pydantic>=2.13.0",
]
kafka = [
    "confluent-kafka>=2.14.0",
    "genson>=1.3.0",
]
# Note: the legacy `pii` and `pii-ner` extras have been removed. PII
# detection now lives in `scalo.logger.scrub` with native
# regex/algorithmic validators (python-stdnum + phonenumbers + a
# TOML-driven national-ID registry). NLP/NER is out of scope for both
# pylib and rustlib log scrubbing — too costly and the false-positive
# rate on unstructured names/locations is unacceptable for logs.
secrets-ansible-vault = [
    "ansible-vault>=4.0.0",
    # ansible-core arrives transitively; 2.21.1 fixes CVE-2026-11332.
    "ansible-core>=2.21.1",
]
secrets-vault = [
    "httpx>=0.28.0",
]
secrets-aws = [
    "boto3>=1.43.0",
    "aiobotocore>=3.6.0",
]
secrets-gcp = [
    "google-cloud-secret-manager>=2.28.0",
]
secrets-azure = [
    "azure-keyvault-secrets>=4.11.0",
    "azure-identity>=1.25.1",
]
secrets = [
    "ansible-vault>=4.0.0",
    "ansible-core>=2.21.1",
    "boto3>=1.43.0",
    "aiobotocore>=3.6.0",
    "google-cloud-secret-manager>=2.28.0",
    "azure-keyvault-secrets>=4.11.0",
    "azure-identity>=1.25.1",
]
version-check = []
enhanced = []
dev = [
    "ansible-vault>=4.0.0",
    "ansible-core>=2.21.1",
    "cryptography>=50.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.0",
    "httpx>=0.28.0",
    "stamina>=26.1.0",
    "boto3>=1.43.0",
    "aiobotocore>=3.6.0",
    "moto[secretsmanager]>=5.2.0",
    "pydantic>=2.13.0",
    # 0.16 is the floor because `ruff format` only takes --extend-exclude from
    # there, and the quality gate passes it.
    "ruff>=0.16.0",
    "ty>=0.0.34",
    "mypy>=2.4.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.6.0",
    "vulture>=2.16",
    "mergedeep>=1.3.4",
    "pre-commit>=4.6.0",
    "tiktoken>=0.14.0",
    "faker>=40.0.0",
]
docs = [
    "sphinx>=9.1.0,<10",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.8.25",
]

[project.urls]
Homepage = "https://github.com/hyperi-io/scalo-py"
Documentation = "https://hyperi-io.github.io/scalo-py/"
Repository = "https://github.com/hyperi-io/scalo-py"
"Bug Reports" = "https://github.com/hyperi-io/scalo-py/issues"
Changelog = "https://github.com/hyperi-io/scalo-py/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "scalo"
module-root = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]
addopts = "-ra -q --strict-markers --log-file=tests/logs/pytest/scalo.log --log-file-level=DEBUG"
pythonpath = [
    "src",
    "tests",
]
log_cli = true
log_cli_level = "INFO"
log_file = "tests/logs/pytest/scalo.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d - %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%S"
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests (no external dependencies)",
    "integration: integration tests (Docker required)",
    "e2e: end-to-end tests (Minikube/K8s required)",
    "smoke: startup smoke tests (mandatory, every push)",
    "slow: tests exceeding 30 seconds",
]
filterwarnings = []

[tool.coverage.run]
source = [
    "src/scalo",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "S",
    "N",
    "PT",
    "RUF",
    "PIE",
    "T20",
]
ignore = [
    "ARG001",
    "ARG002",
    "B904",
    "E402",
    "E722",
    "SIM105",
    "F401",
    "TRY300",
    "F821",
    "E501",
    "B008",
    "B017",
    "B007",
    "B028",
    "C901",
    "E741",
    "F601",
    "UP035",
    "SIM108",
    "W191",
    # Production-specific security relaxations
    "S104",   # hardcoded-bind-all-interfaces (0.0.0.0 is intentional for containers)
    "S110",   # try-except-pass (intentional in error handling)
    "S112",   # try-except-continue (intentional skip patterns)
    "S311",   # suspicious-non-cryptographic-random (used for jitter, not crypto)
    "S603",   # subprocess-without-shell-equals-true (CI scripts)
    "S607",   # start-process-with-partial-path (CI scripts)
    "S608",   # hardcoded-sql-expression (cache module SQL, not user input)
    # Print statements — library uses print for CLI output, not logging
    "T201",
    # Ruff-specific relaxations
    "RUF012", # mutable-class-default (Pydantic/dataclass patterns)
    "RUF059", # unused-unpacked-variable
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF006", # asyncio-dangling-task (intentional fire-and-forget)
    # Naming relaxations
    "N806",   # non-lowercase-variable-in-function
    "N818",   # error-suffix-on-exception-name (existing exception names)
    # Misc
    "PIE810", # multiple-starts-ends-with (stylistic)
    "SIM102", # collapsible-if (readability preference)
    "RUF005", # collection-literal-concatenation (readability preference)
    # Docstring style rules — keep D1xx (missing docstrings), relax formatting
    "D100",   # Missing module docstring (too noisy for __init__.py etc)
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "D200",   # One-line docstring should fit on one line
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D205",   # 1 blank line between summary and description
    "D212",   # Multi-line docstring summary on first line (conflicts with D213)
    "D400",   # First line should end with a period
    "D401",   # First line should be in imperative mood
    "D415",   # First line should end with period/question/exclamation
]
fixable = [
    "ALL",
]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.per-file-ignores]
# Tests use `assert` (pytest convention), hardcoded test passwords, and /tmp paths.
# These are fine in test code — bandit-style hardening doesn't apply.
"tests/**" = [
    "S101", # use of assert
    "S105", # hardcoded password string (test fixtures)
    "S106", # hardcoded password in function arg (test fixtures)
    "S108", # probable insecure /tmp usage (tests use tempfile fixtures)
    "F541", # f-string without placeholders (sometimes intentional in test data)
    "RUF013", # implicit Optional — legacy test files; fix incrementally
    "PT017", # assertion-on-exception (legacy try/except pattern in test_secrets_exceptions.py)
    "PT011", # broad pytest.raises(ValueError) — legacy tests; tighten incrementally
    "PT012", # too-complex pytest.raises body — legacy
    "RUF043", # match=str without raw string — legacy
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Markdown code blocks are illustrations, not source: formatting them flattens
# the alignment that makes the examples readable. Lint still runs over them.
exclude = ["*.md"]

[tool.ty.src]
exclude = ["examples/", "docs/"]

[tool.ty.environment]
python-version = "3.12"

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
]
skips = [
    "B101",
    "B601",
]

[tool.vermin]
targets = [
    "3.12",
]
no_tips = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# UV package manager configuration
[tool.uv]
index-strategy = "unsafe-best-match"
# Supply-chain cooldown (standards/universal/ci.md): never resolve a package
# version published in the last 7 days. CVE fixes bypass via a temporary
# per-package exclude-newer-package entry, not by lowering this.
exclude-newer = "7 days"
# GA release pass: the cooldown is waived and each package below takes its newest
# release. Every entry is a no-op once the 7-day span passes the cutoff on
# 2026-10-13; remove the table then.
exclude-newer-package = { aiobotocore = "2026-10-06T00:40:00Z", aiohttp = "2026-10-06T00:40:00Z", ansible-core = "2026-10-06T00:40:00Z", ast-serialize = "2026-10-06T00:40:00Z", azure-identity = "2026-10-06T00:40:00Z", azure-keyvault-secrets = "2026-10-06T00:40:00Z", boto3 = "2026-10-06T00:40:00Z", botocore = "2026-10-06T00:40:00Z", charset-normalizer = "2026-10-06T00:40:00Z", cryptography = "2026-10-06T00:40:00Z", dulwich = "2026-10-06T00:40:00Z", faker = "2026-10-06T00:40:00Z", fastapi = "2026-10-06T00:40:00Z", filelock = "2026-10-06T00:40:00Z", google-api-core = "2026-10-06T00:40:00Z", google-auth = "2026-10-06T00:40:00Z", google-cloud-secret-manager = "2026-10-06T00:40:00Z", googleapis-common-protos = "2026-10-06T00:40:00Z", librt = "2026-10-06T00:40:00Z", markupsafe = "2026-10-06T00:40:00Z", msgpack = "2026-10-06T00:40:00Z", mypy = "2026-10-06T00:40:00Z", platformdirs = "2026-10-06T00:40:00Z", proto-plus = "2026-10-06T00:40:00Z", python-dotenv = "2026-10-06T00:40:00Z", regex = "2026-10-06T00:40:00Z", ruff = "2026-10-06T00:40:00Z", tzdata = "2026-10-06T00:40:00Z", uv-build = "2026-10-06T00:40:00Z", virtualenv = "2026-10-06T00:40:00Z", wcwidth = "2026-10-06T00:40:00Z", websockets = "2026-10-06T00:40:00Z" }
# Security floors on transitive packages, applied over whatever their dependents
# declare. Re-evaluate at each /deps pass; drop one once the tree requires the
# fixed version itself.
override-dependencies = [
    # Security pins (transitive) -- CVE remediation 2026-06-13. Security
    # fixes are exempt from the release-age cooldown.
    "aiohttp>=3.14.3",        # heap OOB read in the C parser, smuggling, unnegotiated deflate (Dependabot 8/9/10)
    "pyjwt>=2.15.0",          # CVE-2026-101917, CVE-2026-101918, CVE-2026-102265..102269, CVE-2026-102271..102274 (pip-audit)
    "pip>=26.2",              # PYSEC-2026-196, PYSEC-2026-3721 -- build-env installer (pip-audit)
    "cryptography>=50.0.0",   # PKCS#7 Bleichenbacher oracle (Dependabot 11)
    "msgpack>=1.2.1",         # GHSA-6v7p-g79w-8964 (pip-audit)
    "starlette>=1.3.1",       # CVE-2026-54282, CVE-2026-54283 (pip-audit)
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.9.0",
    "fastapi>=0.142.2",
    "google-cloud-secret-manager>=2.26.0",
]

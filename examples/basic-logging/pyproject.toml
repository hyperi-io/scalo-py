[project]
name = "basic-logging-example"
version = "0.1.0"
description = "Example demonstrating scalo structured logging"
requires-python = ">=3.14"
dependencies = [
    "scalo>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "config-cascade-example"
version = "0.1.0"
description = "Example demonstrating scalo 7-layer configuration cascade"
requires-python = ">=3.12"
dependencies = [
    "scalo>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

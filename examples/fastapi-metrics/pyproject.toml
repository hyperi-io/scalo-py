[project]
name = "fastapi-metrics-example"
version = "0.1.0"
description = "Example demonstrating scalo Prometheus metrics with FastAPI"
requires-python = ">=3.14"
dependencies = [
    "scalo>=2.31.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.0",  # For testing
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

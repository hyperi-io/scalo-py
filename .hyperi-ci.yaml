# HyperI CI Configuration - scalo
#
# Only set values that differ from defaults.

license: Apache-2.0

# Declared, never inferred. Category 4 (OSS): Apache-2.0, publishes to PyPI,
# neutral branding. The repo stays private until the consuming apps migrate;
# the package is already public.
classification: oss

build:
  type: package

release:
  enabled: true

test:
  min_coverage: 70  # Current: 73%. Target: 80%. Ratchet up as coverage improves.

quality:
  # examples/ has its own tests/ -- exclude from quality scans
  exclude_paths:
    - examples/
  # Seeded verbatim from python-stdnum's id descriptions: native-script data, not prose.
  charset_exclude:
    - src/scalo/data/national_ids.toml
  python:
    # vulture: library code has extensive public API that looks "unused"
    vulture: warn

  # hyperi-ci reads quality.ignore and passes each entry to its tool
  # (pip-audit --ignore-vuln, semgrep --exclude-rule); a bare .pip-audit-ignore
  # file is NOT read by anything. pip-audit carries no risk acceptances.
  ignore:
    - tool: semgrep
      id: python.lang.compatibility.python37.python37-compatibility-importlib2
      reason: "Flags importlib.resources as Python 3.7+ only; requires-python is >=3.14, so no supported interpreter lacks it."

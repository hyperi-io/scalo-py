# HyperI CI Configuration - scalo
#
# Only set values that differ from defaults.

license: Apache-2.0

# Declared, never inferred. Category 4 (OSS): Apache-2.0, publishes to PyPI,
# neutral branding. The repo stays private until the consuming apps migrate;
# the package is already public.
classification: oss

release:
  enabled: true

# Files scalo-rs owns, copied byte for byte: the contract schema scalo-py validates
# against offline, and the rules corpus both implementations are tested on.
vendor:
  - source: hyperi-io/scalo-rs
    ref: a2598c61bbc3a500cd07f30f09bc297c88d1eaf6  # v2.14.20
    files:
      charts/scalo-service/schema/deployment-contract.v4.schema.json: src/scalo/deployment/data/contract.schema.json
      tests/fixtures/rules_corpus.json: tests/fixtures/rules_corpus.json

test:
  min_coverage: 70  # Current: 73%. Target: 80%. Ratchet up as coverage improves.

quality:
  # examples/ has its own tests/ -- exclude from quality scans
  exclude_paths:
    - examples/
  # Seeded verbatim from python-stdnum's id descriptions: native-script data, not prose.
  charset_exclude:
    - src/scalo/data/national_ids.toml
  python:
    # vulture: library code has extensive public API that looks "unused"
    vulture: warn

  # hyperi-ci reads quality.ignore and passes each entry to its tool
  # (pip-audit --ignore-vuln, semgrep --exclude-rule); a bare .pip-audit-ignore
  # file is NOT read by anything. pip-audit carries no risk acceptances.
  ignore:
    - tool: semgrep
      id: python.lang.compatibility.python37.python37-compatibility-importlib2
      reason: "Flags importlib.resources as Python 3.7+ only; requires-python is >=3.14, so no supported interpreter lacks it."
    # The security pass runs `ruff check --select S`, which drops pyproject's
    # ruff ignore list, so the S relaxations accepted there are repeated here.
    - tool: ruff
      id: S104
      reason: "Bind-all default: a container serves probes and scrapes on the pod IP."
    - tool: ruff
      id: S110
      reason: "try-except-pass only where telemetry, metrics or optional detection must never break the caller."
    - tool: ruff
      id: S311
      reason: "random drives retry jitter and message sampling, never a secret."
    - tool: ruff
      ids: [S603, S607]
      reason: "Fixed argv to git, docker and kind from PATH; no caller input reaches a subprocess."
    # The docstring pass runs `ruff check --select D`, which drops pyproject's
    # ruff ignore list, so the two D relaxations the library keeps live here.
    - tool: ruff
      id: D105
      reason: "Magic methods implement the data-model contract the language already documents."
    - tool: ruff
      id: D107
      reason: "Google style documents constructor arguments in the class docstring, never twice."

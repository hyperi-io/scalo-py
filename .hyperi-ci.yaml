# HyperI CI Configuration - scalo
#
# Only set values that differ from defaults.

license: Apache-2.0

# Declared, never inferred. Category 4 (OSS): Apache-2.0, publishes to PyPI,
# neutral branding. The repo stays private until the consuming apps migrate;
# the package is already public.
classification: oss

build:
  type: package

release:
  enabled: true

test:
  min_coverage: 70  # Current: 73%. Target: 80%. Ratchet up as coverage improves.

quality:
  # examples/ has its own tests/ — exclude from quality scans
  exclude_paths:
    - examples/
  python:
    # vulture: library code has extensive public API that looks "unused"
    vulture: warn

  # No risk acceptances. Both CVEs that had one are fixed in versions the
  # floors now carry, so nothing is suppressed. This is the section hyperi-ci
  # reads (quality.ignore -> --ignore-vuln); a bare .pip-audit-ignore file is
  # NOT read by anything.

[extend]
# Use the default gitleaks config as base
useDefault = true

# Allowlist for historical commits containing secrets in deleted/backup files
# These tokens have been rotated and the files are no longer in use
[allowlist]
description = "scalo historical false positives"


# Paths to ignore (backup files no longer in use, test fixtures with fake secrets)
paths = [
    '''backup/.*''',
    '''\.env\.backup''',
    '''\.pip/pip\.conf''',
    '''tests/unit/test_logger_filters\.py''',     # Fake API keys for log masking tests
    '''tests/unit/test_logger_secrets_leak\.py''', # Fake API keys for L1 secret-leak scrubber tests
    '''tests/unit/test_scrub_gitleaks_toml\.py''', # Fake API keys for L1 gitleaks-TOML scrubber tests
    '''tests/unit/test_scrub_parity_fixtures\.py''', # Fake API keys for L3 parity fixture tests
    '''src/scalo/data/gitleaks\.json''', # The JSON sidecar of gitleaks.toml, whose rules carry the key prefixes they match
    # The masking corpus is synthetic credential-shaped strings, at its path and
    # the one it had in the wheel (history scans).
    '''tests/fixtures/patterns/masking-patterns\.yaml''',
    '''src/scalo/data/masking-patterns\.yaml''',
]

# Regex patterns that are test fixtures (fake secrets for testing), plus one
# genuinely public identifier.
regexes = [
    # A PGP fingerprint is a PUBLIC key identifier, but its 40 hex chars read as
    # high entropy to the generic-api-key rule. Allowlisted by VALUE rather than
    # by file, as scalo-rs does: the Confluent APT signing key, which the history
    # carries, and the made-up one the contract tests' vendor repo uses.
    '''CBBB821E8FAF364F79835C438B1DA6120C2BF624''',
    '''0123456789ABCDEF0123456789ABCDEF01234567''',
    '''sk-proj-abc123def456ghi789''',
    '''secret_abc123def456''',
    '''sk_live_51Hqx2ABCDEFGabcdefg''',
    '''jwt_secret_xyz789''',
    '''sk-1234567890''',
    '''sk-123_ABC-xyz''',
]

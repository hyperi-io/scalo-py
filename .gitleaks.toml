[extend]
# Use the default gitleaks config as base
useDefault = true

# Allowlist for historical commits containing secrets in deleted/backup files
# These tokens have been rotated and the files are no longer in use
[allowlist]
description = "scalo historical false positives"

# NOTE: the sensitive historical docs (docs/SERVICE-ACCESS.md and the
# docs/superpowers infra/plan notes) were scrubbed from history via
# git-filter-repo, so no doc-credential allowlist is needed. The entries
# below are defensive backup-file patterns plus test fixtures that carry
# deliberately fake secrets for the scrubber tests.

# Paths to ignore (backup files no longer in use, test fixtures with fake secrets)
paths = [
    '''backup/.*''',
    '''\.env\.backup''',
    '''\.pip/pip\.conf''',
    '''tests/unit/test_logger_filters\.py''',     # Fake API keys for log masking tests
    '''tests/unit/test_logger_secrets_leak\.py''', # Fake API keys for L1 secret-leak scrubber tests
    '''tests/unit/test_scrub_gitleaks_toml\.py''', # Fake API keys for L1 gitleaks-TOML scrubber tests
    '''tests/unit/test_scrub_parity_fixtures\.py''', # Fake API keys for L3 parity fixture tests
    # The masking corpus is BY CONSTRUCTION a list of credential-shaped strings:
    # its whole job is to assert the masker redacts them. Scanning it for secrets
    # will always fight it. Every value is synthetic -- the flagged one is
    # `eyJhbGciOiJIUzI1NiJ9`, the base64 of the JWT header {"alg":"HS256"}, which
    # is a public constant and not a credential at all.
    '''src/scalo/data/masking-patterns\.yaml''',
]

# Regex patterns that are test fixtures (fake secrets for testing), plus one
# genuinely public identifier.
regexes = [
    # A PGP fingerprint is a PUBLIC key identifier -- publishing it is the whole
    # point. This one pins the Confluent APT signing key so the generated
    # Dockerfile can assert the downloaded key before trusting the repo. Its 40
    # hex chars read as high entropy to the generic-api-key rule. Allowlisted by
    # VALUE rather than by file, so the rule keeps working on the rest of
    # native_deps.py. Same entry as scalo-rs.
    '''CBBB821E8FAF364F79835C438B1DA6120C2BF624''',
    '''sk-proj-abc123def456ghi789''',
    '''secret_abc123def456''',
    '''sk_live_51Hqx2ABCDEFGabcdefg''',
    '''jwt_secret_xyz789''',
    '''sk-1234567890''',
    '''sk-123_ABC-xyz''',
]
